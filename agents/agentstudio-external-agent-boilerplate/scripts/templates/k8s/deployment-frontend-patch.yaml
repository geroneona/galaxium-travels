apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-agent-frontend
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          env:
            - name: VITE_A2A_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: external-agent-secrets
                  key: VITE_A2A_BEARER_TOKEN
                  optional: false
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          startupProbe:
            httpGet:
              path: /
              port: http
